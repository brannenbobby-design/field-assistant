name: Build Florida Man Storm Cleanup Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "game/**"
      - "android.json"
      - ".github/workflows/renpy-android.yml"
      - ".github/keys/**"
  pull_request:
    branches: [ main ]
    paths:
      - "game/**"
      - "android.json"
      - ".github/workflows/renpy-android.yml"
      - ".github/keys/**"

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout game
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up RenPy with Android support
        uses: remarkablegames/setup-renpy@v2
        with:
          cli-version: 8.5.3
          rapt: true

      - name: Lint
        run: renpy-cli "$GITHUB_WORKSPACE" lint --error-code

      - name: Validate first playable configuration
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          android = json.loads(Path("android.json").read_text())
          options = Path("game/options.rpy").read_text()
          script = Path("game/script.rpy").read_text()
          screens = Path("game/screens.rpy").read_text()
          assert android["package"] == "com.brannenservices.floridamanunsupervised"
          assert android["version"] == "1.0.0" and android["numeric_version"] == 12
          assert android["orientation"] == "portrait"
          assert 'define config.version = "1.0.0"' in options
          for token in ["FM_CHAINS", "FM_JOBS", "def fm_drag_drop", "def fm_turn_in", "label start:"]:
              assert token in script, f"Missing gameplay system: {token}"
          for token in ["screen main_menu():", "screen merge_game():", "draggroup:", 'textbutton "TAP FOR SALVAGE"', 'textbutton "DELIVER"']:
              assert token in screens, f"Missing screen element: {token}"
          assert Path("game/images/storm_porch.webp").exists()
          PY

      - name: Install stable test signing key
        shell: bash
        run: |
          cp "$GITHUB_WORKSPACE/.github/keys/android-test.keystore" "$GITHUB_WORKSPACE/android.keystore"
          keytool -list -keystore "$GITHUB_WORKSPACE/android.keystore" -storepass android -alias android >/dev/null

      - name: Build Android APK
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          renpy-launcher android_build "$GITHUB_WORKSPACE" --destination "$GITHUB_WORKSPACE/dist"

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: FloridaManStormCleanup-v1.0.0-Android
          path: dist/*.apk
          if-no-files-found: error
