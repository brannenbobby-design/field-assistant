name: Build RenPy Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "game/**"
      - "android.json"
      - ".github/workflows/renpy-android.yml"
      - ".github/keys/**"
  pull_request:
    branches:
      - main
    paths:
      - "game/**"
      - "android.json"
      - ".github/workflows/renpy-android.yml"
      - ".github/keys/**"

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout game
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up RenPy with Android support
        uses: remarkablegames/setup-renpy@v2
        with:
          cli-version: 8.5.3
          rapt: true

      - name: Lint
        run: renpy-cli "$GITHUB_WORKSPACE" lint --error-code

      - name: Validate version and character integration
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          required_assets = [
              Path("game/images/frank.webp"),
              Path("game/images/peanut.webp"),
          ]
          for asset in required_assets:
              assert asset.exists() and asset.stat().st_size > 10000, f"Missing or empty asset: {asset}"

          options = Path("game/options.rpy").read_text(encoding="utf-8")
          script = Path("game/script.rpy").read_text(encoding="utf-8")
          art = Path("game/art.rpy").read_text(encoding="utf-8")
          android = json.loads(Path("android.json").read_text(encoding="utf-8"))

          assert 'define config.version = "0.3.3"' in options
          assert 'define build.version = "0.3.3"' in options
          assert android["version"] == "0.3.3" and android["numeric_version"] == 6

          for token in [
              'define f = Character("Frank"',
              'define p = Character("Peanut"',
              'show frank at fm_right',
              'show peanut at fm_right',
          ]:
              assert token in script, f"Character integration missing: {token}"

          for token in ['image frank = "images/frank.webp"', 'image peanut = "images/peanut.webp"']:
              assert token in art, f"Art definition missing: {token}"

          assert '"FRANK:' not in script, "Frank still has raw text-speaker dialogue"
          assert '"PEANUT:' not in script, "Peanut still has raw text-speaker dialogue"
          PY

      - name: Install stable test signing key
        shell: bash
        run: |
          cp "$GITHUB_WORKSPACE/.github/keys/android-test.keystore" "$GITHUB_WORKSPACE/android.keystore"
          keytool -list -keystore "$GITHUB_WORKSPACE/android.keystore" -storepass android -alias android >/dev/null

      - name: Build Android APK
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          renpy-launcher android_build "$GITHUB_WORKSPACE" --destination "$GITHUB_WORKSPACE/dist"

      - name: Show APK output
        if: always()
        shell: bash
        run: |
          find "$GITHUB_WORKSPACE" -maxdepth 4 -type f -name "*.apk" -print || true

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: FloridaManUnsupervised-v0.3.3-Android
          path: dist/*.apk
          if-no-files-found: error
