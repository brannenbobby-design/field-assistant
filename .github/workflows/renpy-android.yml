name: Build RenPy Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "game/**"
      - "android.json"
      - ".github/workflows/renpy-android.yml"
      - ".github/keys/**"
  pull_request:
    branches:
      - main
    paths:
      - "game/**"
      - "android.json"
      - ".github/workflows/renpy-android.yml"
      - ".github/keys/**"

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout game
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up RenPy with Android support
        uses: remarkablegames/setup-renpy@v2
        with:
          cli-version: 8.5.3
          rapt: true

      - name: Lint
        run: renpy-cli "$GITHUB_WORKSPACE" lint --error-code

      - name: Validate version and character integration
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          required_assets = [
              Path("game/images/frank.webp"),
              Path("game/images/peanut.webp"),
          ]
          for asset in required_assets:
              assert asset.exists() and asset.stat().st_size > 10000, f"Missing or empty asset: {asset}"

          options = Path("game/options.rpy").read_text(encoding="utf-8")
          script = Path("game/script.rpy").read_text(encoding="utf-8")
          art = Path("game/art.rpy").read_text(encoding="utf-8")
          android = json.loads(Path("android.json").read_text(encoding="utf-8"))

          assert 'define config.version = "0.3.7"' in options
          assert 'define build.version = "0.3.7"' in options
          assert android["version"] == "0.3.7" and android["numeric_version"] == 10

          for token in [
              'define f = Character("Frank"',
              'define p = Character("Peanut"',
              'show frank at fm_right',
              'show peanut at fm_right',
          ]:
              assert token in script, f"Character integration missing: {token}"

          for token in ['image frank = "images/frank.webp"', 'image peanut = "images/peanut.webp"']:
              assert token in art, f"Art definition missing: {token}"

          presentation = Path("game/screens.rpy").read_text(encoding="utf-8")
          for token in [
              "screen main_menu():",
              "screen pause_menu():",
              "screen save():",
              "screen load():",
              "screen preferences():",
              'textbutton "NEW GAME"',
              'textbutton "SAVE GAME"',
          ]:
              assert token in presentation, f"Presentation screen missing: {token}"

          assert "define fm_scene = Dissolve(0.25)" in art
          assert "with fm_scene" in script
          assert 'action ShowMenu("pause_menu")' in script

          for token in [
              "label wednesday_yard:",
              "label turbine_decision:",
              "label turbine_sale:",
              "label turbine_return:",
              "label turbine_keep:",
              "label complete_turbine_quest:",
              'show screen fm_toast("QUEST STARTED: ABSOLUTELY NOT")',
              'show screen fm_toast("QUEST COMPLETE: ABSOLUTELY NOT")',
          ]:
              assert token in script, f"Wednesday content missing: {token}"

          assert 'screen fm_toast(message):' in presentation
          assert 'text "ACTIVE JOB"' in script

          # Phone control-flow regression guard:
          # story use must Return() to the calling label, map use must only hide the overlay.
          assert 'screen phone_screen(called=False):' in presentation
          assert 'call screen phone_screen(called=True)' in script
          assert 'action Show("phone_screen", called=False)' in script
          assert 'if called:' in presentation and 'action Return()' in presentation
          assert 'action Hide("phone_screen")' in presentation
          assert 'SetScreenVariable("tab", "messages")' in presentation
          assert 'SetScreenVariable("tab", "jobs")' in presentation
          assert 'SetScreenVariable("tab", "bag")' in presentation
          assert 'SetScreenVariable("tab", "stats")' in presentation
          assert 'screen phone_screen():' not in script

          # Character clarity / staging regression guards.
          assert 'show wayne at fm_left\n    show dale at fm_center\n    show peanut at fm_right' not in script
          assert 'show dale at fm_center with dissolve\n        show peanut at fm_right with dissolve' not in script
          assert 'hide wayne with dissolve\n        show dale at fm_left with dissolve' in script
          assert 'hide dale with dissolve\n        show peanut at fm_right with dissolve' in script
          assert 'label delivery_dropoff:\n    scene bg sand_trap with fm_scene\n\n    # POV staging' in script

          # Dialogue must stay anchored to the bottom on Android.
          assert 'screen say(who, what):' in presentation
          assert 'ypos 790' in presentation
          assert 'xsize 1840' in presentation
          assert 'background Solid("#071116f4")' in presentation
          assert 'text "TAP TO CONTINUE"' in presentation

          assert '"FRANK:' not in script, "Frank still has raw text-speaker dialogue"
          assert '"PEANUT:' not in script, "Peanut still has raw text-speaker dialogue"
          PY

      - name: Install stable test signing key
        shell: bash
        run: |
          cp "$GITHUB_WORKSPACE/.github/keys/android-test.keystore" "$GITHUB_WORKSPACE/android.keystore"
          keytool -list -keystore "$GITHUB_WORKSPACE/android.keystore" -storepass android -alias android >/dev/null

      - name: Build Android APK
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          renpy-launcher android_build "$GITHUB_WORKSPACE" --destination "$GITHUB_WORKSPACE/dist"

      - name: Show APK output
        if: always()
        shell: bash
        run: |
          find "$GITHUB_WORKSPACE" -maxdepth 4 -type f -name "*.apk" -print || true

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: FloridaManUnsupervised-v0.3.7-Android
          path: dist/*.apk
          if-no-files-found: error
