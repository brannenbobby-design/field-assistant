name: Build RenPy Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "game/**"
      - "android.json"
      - ".github/workflows/renpy-android.yml"
      - ".github/keys/**"
  pull_request:
    branches:
      - main
    paths:
      - "game/**"
      - "android.json"
      - ".github/workflows/renpy-android.yml"
      - ".github/keys/**"

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout game
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up RenPy with Android support
        uses: remarkablegames/setup-renpy@v2
        with:
          cli-version: 8.5.3
          rapt: true

      - name: Lint
        run: renpy-cli "$GITHUB_WORKSPACE" lint --error-code

      - name: Install stable test signing key
        shell: bash
        run: |
          cp "$GITHUB_WORKSPACE/.github/keys/android-test.keystore" "$GITHUB_WORKSPACE/android.keystore"
          keytool -list -keystore "$GITHUB_WORKSPACE/android.keystore" -storepass android -alias android >/dev/null

      - name: Build Android APK
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          renpy-launcher android_build "$GITHUB_WORKSPACE" --destination "$GITHUB_WORKSPACE/dist"

      - name: Show APK output
        if: always()
        shell: bash
        run: |
          find "$GITHUB_WORKSPACE" -maxdepth 4 -type f -name "*.apk" -print || true

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: FloridaManUnsupervised-v0.3.2-Android
          path: dist/*.apk
          if-no-files-found: error
