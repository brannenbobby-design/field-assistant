name: Build RenPy v0.1

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "game/**"
      - ".github/workflows/renpy-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout game
        uses: actions/checkout@v4

      - name: Download RenPy SDK
        run: |
          wget -q https://www.renpy.org/dl/8.5.4/renpy-8.5.4-sdk.tar.bz2
          tar -xjf renpy-8.5.4-sdk.tar.bz2

      - name: Lint
        run: |
          ./renpy-8.5.4-sdk/renpy.sh "$GITHUB_WORKSPACE" lint --error-code

      - name: Build Windows test distribution
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          ./renpy-8.5.4-sdk/renpy.sh launcher distribute "$GITHUB_WORKSPACE" --destination "$GITHUB_WORKSPACE/dist" --package win --no-update

      - name: Upload test build
        uses: actions/upload-artifact@v4
        with:
          name: FloridaManUnsupervised-v0.1-Windows
          path: dist/*
          if-no-files-found: error
