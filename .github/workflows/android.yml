name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Apply staged build 111 noodle and flamingo polish
        run: |
          if [ -f tools/polish_111.py ]; then
            python3 tools/polish_111.py
          fi
      - name: Build debug APK
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: field-assistant-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Bake build 111 source into main
        if: success()
        run: |
          if [ -f tools/polish_111.py ]; then
            rm tools/polish_111.py
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/src/main/java/com/brannenservices/fieldassistant/MainActivity.kt tools/polish_111.py
            git commit -m "Bake build 111 noodle and flamingo polish [skip ci]"
            git push origin HEAD:main
          fi
