name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Apply staged fist combo
        run: |
          if [ -f tools/polish_113.py ]; then
            python3 tools/polish_113.py
            python3 - <<'PY'
          from pathlib import Path
          path = Path("app/src/main/java/com/brannenservices/fieldassistant/MainActivity.kt")
          s = path.read_text()
          needle = '''        private fun currentWalkFrame(): Int {
              return ((t * 6f).toInt() % AnimatedRaster.manWalk.size).coerceAtLeast(0)
          }

          '''
          helper = '''        private fun smoothStep(v: Float): Float {
              val x = v.coerceIn(0f, 1f)
              return x * x * (3f - 2f * x)
          }

          '''
          if "private fun smoothStep" not in s:
              if s.count(needle) != 1:
                  raise RuntimeError("currentWalkFrame anchor not found exactly once")
              s = s.replace(needle, needle + helper, 1)
              path.write_text(s)
          PY
          fi
      - name: Build debug APK
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: field-assistant-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Bake fist combo into main
        if: success()
        run: |
          if [ -f tools/polish_113.py ]; then
            rm tools/polish_113.py
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/src/main/java/com/brannenservices/fieldassistant/MainActivity.kt tools/polish_113.py
            git commit -m "Bake fist combo combat [skip ci]"
            git push origin HEAD:main
          fi
